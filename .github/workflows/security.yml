name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "21 9 * * 1"

permissions:
  contents: read
  # gitleaks-action lists PR commits via the API on pull_request events;
  # without this it fails with "Resource not accessible by integration" (403).
  pull-requests: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all]"
      - run: python -m pip install pip-audit
      - run: pip-audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
