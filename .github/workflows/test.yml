name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # Same pin as pyproject.toml; installed explicitly so -e can use --no-deps.
      - run: pip install "agent-autonomy-score @ git+https://github.com/aidan2111/agent-autonomy-score@5bc49198489778d45b05a65711e30b2e1287d12e"
      - run: pip install -e . --no-deps
      # Drift canary: fails loudly if the pinned scoring dep no longer matches.
      - run: python -c "import llm_bidding.scoring as s; s.ensure_compatible()"
      - run: python -m unittest discover -s tests -v
