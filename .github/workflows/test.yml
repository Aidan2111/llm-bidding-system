name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.check_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            check_name: "test (3.10)"
          - os: ubuntu-latest
            python-version: "3.11"
            check_name: "test (3.11)"
          - os: ubuntu-latest
            python-version: "3.12"
            check_name: "test (3.12)"
          # The package declares OS independence; run the supported baseline on
          # Windows to catch path and console-entry-point regressions.
          - os: windows-latest
            python-version: "3.11"
            check_name: "windows smoke"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # Same pin as pyproject.toml; installed explicitly so -e can use --no-deps.
      - run: pip install "agent-autonomy-score @ git+https://github.com/aidan2111/agent-autonomy-score@29270c40a991a2e01e241b8cb72c8026c11bd53d"
      - run: pip install build twine
      - run: pip install -e . --no-deps
      # Drift canary: fails loudly if the pinned scoring dep no longer matches.
      - run: python -c "import llm_bidding.scoring as s; s.ensure_compatible()"
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
      - run: llm-bid --help
